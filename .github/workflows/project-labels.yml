---
name: Project / PR Branch Labeler

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
    - master


jobs:
  label-pr:
    runs-on: ubuntu-latest
    steps:
    - name: Label PR
      if: github.event.action == 'opened'
      uses: ffittschen/pr-branch-labeler@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
