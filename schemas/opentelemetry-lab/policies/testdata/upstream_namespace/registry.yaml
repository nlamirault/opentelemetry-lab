# The Zig app's request counter, defined inside the upstream `http.` namespace.
file_format: definition/2

metrics:
- name: http.server.requests
  brief: HTTP requests received.
  instrument: counter
  unit: "{request}"
  stability: development
  requirement_level: recommended
