[package]
name = "otel-rust"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
autobenches = false

[[bin]]
name = "otel-rust"
path = "src/main.rs"
bench = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.89"
axum = "0.8.9"
axum-tracing-opentelemetry = "0.42.1"
opentelemetry = { version = "0.33.1", features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-http = "0.33.1"
# Exactly one HTTP client: enabling both reqwest clients makes the HTTP
# exporters fail with NoHttpClient.
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
  "internal-logs",
  "grpc-tonic",
  "http-proto",
  "reqwest-blocking-client",
] }
opentelemetry-semantic-conventions = "0.33.1"
opentelemetry-stdout = { version = "0.33.1", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace", "metrics", "logs"] }
opentelemetry-resource-detectors = "0.13.0"
reqwest = "0.13.5"
serde_json = "1.0.128"
tokio = { version = "1.0", features = ["full"] }
tracing = { version = "0.1.40", features = ["std"] }
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "registry", "std", "fmt"] }
