[project]
name = "otel-python"
version = "1.0.0"
description = "OpenTelemetry Lab application in Python, with FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "opentelemetry-api==1.45.2",
  "opentelemetry-exporter-otlp==1.45.2",
  "opentelemetry-exporter-prometheus==0.66b2",
  "opentelemetry-instrumentation-fastapi==0.66b2",
  "opentelemetry-instrumentation-logging==0.66b2",
  "opentelemetry-instrumentation-httpx==0.66b2",
  "opentelemetry-sdk==1.45.2",
  "prometheus-client==0.26.0",
  "python-json-logger==4.2.0",
  "uvicorn==0.54.0",
  "opentelemetry-instrumentation-system-metrics==0.66b2",
]

[project.scripts]
otelpython = "otelpython.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["otelpython"]

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["otelpython", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "TC",  # flake8-type-checking
  "W",   # pycodestyle warnings
  "RUF", # Ruff-specific rules
]
ignore = [
  "E501", # line too long, handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["otelpython"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
