---
global:
  scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m

# App and collector metrics arrive via OTLP remote-write (--web.enable-otlp-receiver),
# pushed by the collector's otlp_http/metrics exporter — no scraping required.
#
# The scrape job below is only for span-derived metrics (spanmetrics connector +
# prometheus exporter on :8889). Both are currently disabled in the collector config
# (etc/otel/otel-collector-*.yaml). Re-enable that pipeline before uncommenting, else
# the target stays down with "connection refused" on :8889.
#
# scrape_configs:
# - job_name: aggregated-trace-metrics
#   static_configs:
#   - targets: ['otel-collector:8889']
